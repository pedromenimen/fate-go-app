<div class="home-page">
  <div class="server-card">
    <div class="server-card-glow"></div>
    <h1 class="home-title">Fate/Grand Order</h1>
    <p class="home-subtitle">Servant Archive</p>
    <div class="divider"></div>
    <p class="home-desc">Choose your server region to browse servant data</p>
    <div class="server-buttons">
      <button class="server-btn server-btn-jp" (click)="setServer('JP')" routerLink="/dashboard">
        <span class="btn-label">Japan</span>
        <span class="btn-region">JP Server</span>
      </button>
      <button class="server-btn server-btn-na" (click)="setServer('NA')" routerLink="/dashboard">
        <span class="btn-label">North America</span>
        <span class="btn-region">NA Server</span>
      </button>
    </div>
  </div>
</div>
