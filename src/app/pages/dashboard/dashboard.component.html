<div class="dashboard-page">
  <div class="search-section">
    <h1 class="dashboard-title">Servant Archive</h1>
    <p class="dashboard-subtitle">Browse your collection of servants</p>
    <mat-form-field class="search-field" appearance="outline" color="primary">
      <mat-label>Search servant...</mat-label>
      <input type="text" matInput [formControl]="searchValue"
        placeholder="Type a servant name...">
    </mat-form-field>
  </div>

  @if (loading) {
    <div class="pagination top-pagination pagination-skeleton">
      <div class="skeleton-btn shimmer"></div>
      <div class="skeleton-btn shimmer"></div>
      <div class="skeleton-btn shimmer"></div>
      <div class="skeleton-btn shimmer"></div>
      <div class="skeleton-btn shimmer"></div>
      <div class="skeleton-btn shimmer"></div>
      <div class="skeleton-btn shimmer"></div>
    </div>
  } @else {
    <div class="pagination top-pagination">
      <button class="glass-btn" [class.disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1">
        ‹ Prev
      </button>
      @for (page of getPageNumbers(); track page) {
        <button class="glass-btn" [class.active]="currentPage === page" (click)="goToPage(page)">
          {{page}}
        </button>
      }
      <button class="glass-btn" [class.disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages">
        Next ›
      </button>
      <label class="page-size-inline">
        <span class="page-size-label">Per page:</span>
        <select class="page-size-select" [value]="pageSize" (change)="onPageSizeChange($event)" aria-label="Items per page">
          @for (size of pageSizeOptions; track size) {
            <option [value]="size">{{size}}</option>
          }
        </select>
      </label>
    </div>
  }

  <app-card class="card-container" [filteredServantList]="pagedServants" [loading]="loading" [skeletonCount]="pageSize"></app-card>

  @if (loading) {
    <div class="controls-panel bottom-controls controls-panel-skeleton">
      <div class="skeleton-label shimmer"></div>
      <div class="skeleton-btn shimmer"></div>
      <div class="skeleton-btn shimmer"></div>
      <div class="skeleton-btn shimmer"></div>
      <div class="skeleton-btn shimmer"></div>
    </div>

    <div class="pagination bottom-pagination pagination-skeleton">
      <div class="skeleton-btn shimmer"></div>
      <div class="skeleton-btn shimmer"></div>
      <div class="skeleton-btn shimmer"></div>
      <div class="skeleton-btn shimmer"></div>
      <div class="skeleton-btn shimmer"></div>
      <div class="skeleton-btn shimmer"></div>
      <div class="skeleton-btn shimmer"></div>
    </div>
  } @else {
    <div class="pagination bottom-pagination">
      <button class="glass-btn" [class.disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1">
        ‹ Prev
      </button>
      @for (page of getPageNumbers(); track page) {
        <button class="glass-btn" [class.active]="currentPage === page" (click)="goToPage(page)">
          {{page}}
        </button>
      }
      <button class="glass-btn" [class.disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages">
        Next ›
      </button>
      <label class="page-size-inline">
        <span class="page-size-label">Per page:</span>
        <select class="page-size-select" [value]="pageSize" (change)="onPageSizeChange($event)" aria-label="Items per page">
          @for (size of pageSizeOptions; track size) {
            <option [value]="size">{{size}}</option>
          }
        </select>
      </label>
    </div>
  }
</div>
