<div class="dashboard-page">
  <div class="search-section">
    <h1 class="dashboard-title">Servant Archive</h1>
    <p class="dashboard-subtitle">Browse your collection of servants</p>
    <mat-form-field class="search-field" appearance="outline" color="primary">
      <mat-label>Search servant...</mat-label>
      <input type="text" matInput [formControl]="searchValue" [matAutocomplete]="auto"
        placeholder="Type a servant name...">
      <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn">
        @for (option of filteredOptions | async; track option) {
          <mat-option [value]="option">
            <div class="option-content">
              <img [src]="option.face" class="option-icon" alt="">
              <span>{{option.name}}</span>
            </div>
          </mat-option>
        }
      </mat-autocomplete>
    </mat-form-field>
  </div>
  <app-card class="card-container" [filteredServantList]="filteredOptions"></app-card>
</div>
